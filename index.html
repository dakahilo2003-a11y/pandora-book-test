<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판도라 전자책 시험</title><style>*{box-sizing:border-box}body{margin:0;background:#e4e5dc;color:#344536;font-family:'Batang','Noto Serif KR',serif;text-align:center}h1{font-size:20px;margin:16px}#book{margin:auto;max-width:94vw}.page{background:#faf3e4;padding:9%;border:1px solid #d6cbb6;box-shadow:inset 8px 0 20px #0001;text-align:left;overflow:hidden}.page h2{font-size:clamp(20px,5vw,32px);margin:0 0 28px}.page p{font-size:clamp(17px,4vw,23px);line-height:1.9}.controls{margin:12px;display:flex;justify-content:center;gap:20px;align-items:center}button{padding:10px 18px;background:#405941;color:white;border:0;border-radius:8px;font-size:16px}#status{font-size:14px}</style></head><body><h1>판도라 · 전자책 기능 시험</h1><div id="book"><section class="page"><h2>나의 새로운 출발</h2><p>전자책 기능을 확인하기 위한 공개용 샘플입니다.</p><p>책장을 왼쪽으로 넘겨 보세요.</p></section><section class="page"><h2>새로운 목표</h2><p>오늘 할 수 있는 작은 행동부터 시작합니다.</p><p>이 페이지는 실제 교육 교안이 아닙니다.</p></section><section class="page"><h2>한 걸음씩</h2><p>읽고, 생각하고, 실천하는 과정입니다.</p></section><section class="page"><h2>시험 완료</h2><p>이전 페이지로 돌아가 보세요.</p></section></div><div class="controls"><button id="prev">이전</button><span id="status">1 / 4</span><button id="next">다음</button></div><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>const b=document.getElementById('book'),s=document.getElementById('status');if(window.St){const f=new St.PageFlip(b,{width:420,height:580,size:'stretch',minWidth:260,maxWidth:420,minHeight:360,maxHeight:580,usePortrait:true,showCover:false,mobileScrollSupport:false});f.loadFromHTML(b.querySelectorAll('.page'));f.on('flip',e=>s.textContent=(e.data+1)+' / 4');prev.onclick=()=>f.flipPrev();next.onclick=()=>f.flipNext()}else{let i=0;const p=[...b.children];function show(){p.forEach((x,j)=>{x.style.display=i===j?'block':'none';x.style.minHeight='60vh'});s.textContent=(i+1)+' / 4 (간편 모드)'}prev.onclick=()=>{i=Math.max(0,i-1);show()};next.onclick=()=>{i=Math.min(3,i+1);show()};show()}</script></body></html>
