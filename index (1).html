<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판도라 전자책 시험</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e4d9;color:#344737;font-family:serif;text-align:center}header{padding:12px}button,label{display:inline-block;padding:10px 16px;background:#405c43;color:white;border:0;border-radius:6px;cursor:pointer}#stage{margin:auto;width:min(94vw,calc((100dvh - 160px)*.725));height:calc(100dvh - 160px);max-height:900px}#book{margin:auto}.page{background:#faf5e9}.page img{width:100%;height:100%;object-fit:contain}footer{padding:8px;display:flex;justify-content:center;align-items:center;gap:16px}input{display:none}</style><header><strong>판도라 전자책 시험</strong>　<label>PDF 불러오기<input id="file" type="file" accept="application/pdf"></label><div id="status" role="status">PC 또는 휴대폰의 PDF를 선택하세요. 외부로 전송하지 않습니다.</div></header><div id="stage"><div id="book"></div></div><footer><button id="prev">◀ 이전</button><span id="count">–</span><button id="next">다음 ▶</button></footer><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script type="module">import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';const $=id=>document.getElementById(id);let flip,urls=[],total=0;function count(){ $('count').textContent=flip?`${flip.getCurrentPageIndex()+1} / ${total}`:'–'; }$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$('status').textContent='PDF 읽는 중…';if(flip){flip.destroy();flip=null;}urls.forEach(URL.revokeObjectURL);urls=[];$('stage').innerHTML='<div id="book"></div>';const pdf=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;total=pdf.numPages;const first=await pdf.getPage(1),v=first.getViewport({scale:1});const ratio=v.width/v.height;const stage=$('stage');stage.style.width=`min(94vw,calc((100dvh - 160px)*${ratio}))`;for(let i=1;i<=total;i++){const p=await pdf.getPage(i),vp=p.getViewport({scale:Math.min(2.5,1500/p.getViewport({scale:1}).width)}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const blob=await new Promise(r=>c.toBlob(r,'image/png'));urls.push(URL.createObjectURL(blob));c.width=c.height=0;$('status').textContent=`페이지 준비 중 ${i}/${total}`;}const w=Math.floor(stage.clientWidth),h=Math.floor(w/ratio);flip=new St.PageFlip($('book'),{width:w,height:h,size:'fixed',usePortrait:true,showCover:false,mobileScrollSupport:false,maxShadowOpacity:.35});flip.loadFromImages(urls);flip.on('flip',count);count();$('status').textContent='좌우로 넘겨 읽으세요.';await pdf.destroy();}catch(err){$('status').textContent='PDF를 열지 못했습니다: '+err.message;}};$('prev').onclick=()=>flip?.flipPrev();$('next').onclick=()=>flip?.flipNext();document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip?.flipPrev();if(e.key==='ArrowRight')flip?.flipNext();});</script></html>
